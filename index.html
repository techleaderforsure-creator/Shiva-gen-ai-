
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiva gen ai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #1a0b2e;
      /* Updated background with purple/magenta aesthetic to match the user's provided image */
      background-image: linear-gradient(to bottom, rgba(26, 11, 46, 0.85), rgba(10, 5, 20, 0.98)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
      color: #f8fafc;
    }

    /* Custom scrollbar for better integration with the purple theme */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(26, 11, 46, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: #8b5cf6;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #a78bfa;
    }

    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
    .bg-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(26, 11, 46, 0) 70%);
      pointer-events: none;
      z-index: -1;
      animation: pulse-slow 8s ease-in-out infinite;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div class="bg-glow"></div>
  <div id="root"></div>
</body>
</html>
